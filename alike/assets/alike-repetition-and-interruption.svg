<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580"><rect width="1400" height="580" fill="#F7FAF9"/><text x="42" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#207A80" text-anchor="start">03 / EDITING AND REPETITION</text><text x="42" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#183940" text-anchor="start">A routine interrupted</text><text x="42" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#51686D" text-anchor="start">The familiar cycle makes a small change in behavior feel consequential.</text><rect x="42" y="189" width="882" height="317" rx="14" fill="#EAF1F0" stroke="#D5E2DF" stroke-width="2"/><text x="75" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#183940" text-anchor="start">THE EVERYDAY LOOP</text><rect x="76" y="282" width="245" height="139" rx="14" fill="#fff" stroke="#D5E2DF" stroke-width="2"/><text x="98" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#183940" text-anchor="start">MORNING</text><text x="98" y="369" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#51686D" text-anchor="start">Departure</text><path d="M334 345 L344 354 L334 363" fill="none" stroke="#207A80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="355" y="282" width="245" height="139" rx="14" fill="#fff" stroke="#D5E2DF" stroke-width="2"/><text x="377" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#183940" text-anchor="start">DAY</text><text x="377" y="369" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#51686D" text-anchor="start">School and work</text><path d="M613 345 L623 354 L613 363" fill="none" stroke="#207A80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="634" y="282" width="245" height="139" rx="14" fill="#fff" stroke="#D5E2DF" stroke-width="2"/><text x="656" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#183940" text-anchor="start">RETURN</text><text x="656" y="369" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#51686D" text-anchor="start">The pattern repeats</text><path d="M800 446 L200 446" fill="none" stroke="#207A80" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10"/><path d="M211 437 L201 446 L211 455" fill="none" stroke="#207A80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="482" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#207A80" text-anchor="middle">REPEATED EDITING RHYTHM</text><rect x="954" y="189" width="404" height="317" rx="14" fill="#FDF3E9" stroke="#EFCFB5" stroke-width="2"/><text x="986" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#A35F35" text-anchor="start">THE INTERRUPTION</text><circle cx="1008" cy="302" r="18" fill="#DF9050"/><text x="1045" y="312" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#183940" text-anchor="start">Notice a change</text><circle cx="1008" cy="366" r="18" fill="#DF9050"/><text x="1045" y="376" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#183940" text-anchor="start">Listen together</text><circle cx="1008" cy="430" r="18" fill="#DF9050"/><text x="1045" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#183940" text-anchor="start">Respond differently</text><text x="42" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#51686D" text-anchor="start">INTERPRETIVE FIGURE  ·  A visual reading of narrative rhythm; not a shot-by-shot timeline.</text></svg>