<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580"><rect width="1400" height="580" fill="#F7FAF9"/><text x="42" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#207A80" text-anchor="start">02 / SPACE AND BEHAVIOR</text><text x="42" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#183940" text-anchor="start">Two uses of the same city</text><text x="42" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#51686D" text-anchor="start">The institutional route repeats; the musician and tree invite unplanned attention.</text><rect x="42" y="190" width="638" height="316" rx="14" fill="#EBF1F0" stroke="#D5E2DF" stroke-width="2"/><rect x="720" y="190" width="638" height="316" rx="14" fill="#FDF3E9" stroke="#F1DCC8" stroke-width="2"/><circle cx="93" cy="240" r="22" fill="#7CA5A5"/><text x="132" y="250" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#183940" text-anchor="start">THE ASSIGNED ROUTE</text><text x="89" y="303" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#51686D" text-anchor="start">HOME</text><path d="M170 296 L272 296" fill="none" stroke="#7DA8A8" stroke-width="5" stroke-linecap="round"/><path d="M260 287 L270 296 L260 305" fill="none" stroke="#7DA8A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="295" y="303" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#51686D" text-anchor="start">SCHOOL / WORK</text><text x="91" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#183940" text-anchor="start">•  Repeated journeys and schedules</text><text x="91" y="411" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#183940" text-anchor="start">•  Standardized tasks and movement</text><text x="91" y="451" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#183940" text-anchor="start">•  Attention directed toward duty</text><circle cx="771" cy="240" r="22" fill="#DF9050"/><text x="811" y="250" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#183940" text-anchor="start">THE VOLUNTARY DETOUR</text><text x="768" y="303" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#51686D" text-anchor="start">STREET</text><path d="M866 296 L958 296" fill="none" stroke="#DF9050" stroke-width="5" stroke-linecap="round"/><path d="M945 287 L955 296 L945 305" fill="none" stroke="#DF9050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="978" y="303" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#51686D" text-anchor="start">TREE / MUSIC</text><text x="767" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#183940" text-anchor="start">•  Pausing instead of passing through</text><text x="767" y="411" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#183940" text-anchor="start">•  Curiosity without a fixed objective</text><text x="767" y="451" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#183940" text-anchor="start">•  Attention directed toward another</text><text x="42" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#51686D" text-anchor="start">INTERPRETIVE FIGURE  ·  A conceptual contrast, not a literal map of the film city.</text></svg>