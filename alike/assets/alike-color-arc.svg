<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580"><rect width="1400" height="580" fill="#F7FAF9"/><text x="42" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#207A80" text-anchor="start">01 / COLOR AND NARRATIVE</text><text x="42" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#183940" text-anchor="start">A visible arc of attention</text><text x="42" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#51686D" text-anchor="start">The changing palette marks shifts in connection and expression—not measured emotion.</text><rect x="42" y="190" width="312" height="310" rx="14" fill="#fff" stroke="#D5E2DF" stroke-width="2"/><text x="66" y="228" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#207A80" text-anchor="start">01</text><text x="66" y="272" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#183940" text-anchor="start">CURIOSITY</text><circle cx="132" cy="361" r="46" fill="#DF9050"/><circle cx="262" cy="361" r="46" fill="#447E9B"/><text x="132" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#51686D" text-anchor="middle">PASTE</text><text x="262" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#51686D" text-anchor="middle">COPI</text><text x="66" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#51686D" text-anchor="start">Interest is vivid</text><circle cx="369" cy="348" r="21" fill="#F7FAF9"/><path d="M367 339 L377 348 L367 357" fill="none" stroke="#207A80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="385" y="190" width="312" height="310" rx="14" fill="#fff" stroke="#D5E2DF" stroke-width="2"/><text x="409" y="228" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#207A80" text-anchor="start">02</text><text x="409" y="272" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#183940" text-anchor="start">ROUTINE</text><circle cx="475" cy="361" r="46" fill="#BB957E"/><circle cx="605" cy="361" r="46" fill="#687D86"/><text x="475" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#51686D" text-anchor="middle">PASTE</text><text x="605" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#51686D" text-anchor="middle">COPI</text><text x="409" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#51686D" text-anchor="start">Expression narrows</text><circle cx="712" cy="348" r="21" fill="#F7FAF9"/><path d="M710 339 L720 348 L710 357" fill="none" stroke="#207A80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="728" y="190" width="312" height="310" rx="14" fill="#EEF2F1" stroke="#D5E2DF" stroke-width="2"/><text x="752" y="228" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#207A80" text-anchor="start">03</text><text x="752" y="272" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#183940" text-anchor="start">DISCONNECTION</text><circle cx="818" cy="361" r="46" fill="#A9B7B8"/><circle cx="948" cy="361" r="46" fill="#9FAEAF"/><text x="818" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#51686D" text-anchor="middle">PASTE</text><text x="948" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#51686D" text-anchor="middle">COPI</text><text x="752" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#51686D" text-anchor="start">Color drains</text><circle cx="1055" cy="348" r="21" fill="#F7FAF9"/><path d="M1053 339 L1063 348 L1053 357" fill="none" stroke="#207A80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1071" y="190" width="312" height="310" rx="14" fill="#fff" stroke="#D5E2DF" stroke-width="2"/><text x="1095" y="228" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#207A80" text-anchor="start">04</text><text x="1095" y="272" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#183940" text-anchor="start">RECONNECTION</text><circle cx="1161" cy="361" r="46" fill="#DF9050"/><circle cx="1291" cy="361" r="46" fill="#447E9B"/><text x="1161" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#51686D" text-anchor="middle">PASTE</text><text x="1291" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#51686D" text-anchor="middle">COPI</text><text x="1095" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#51686D" text-anchor="start">Attention returns</text><text x="42" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#51686D" text-anchor="start">INTERPRETIVE FIGURE  ·  Colors are schematic and not sampled from film frames.</text></svg>